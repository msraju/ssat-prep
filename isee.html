<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISEE Middle Level Verbal Practice Test • 4 Choices</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #8b5cf6;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --bg: #090d16;
      --card-bg: rgba(30, 41, 59, 0.9);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }
    .header {
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 2px solid var(--card-border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .container { max-width: 1000px; margin: 0 auto; padding: 24px; }
    .screen { display: none; }
    .screen.active { display: block; }
    .card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 24px;
      padding: 32px;
      margin: 20px auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .btn {
      background: linear-gradient(135deg, #8b5cf6, #c084fc);
      color: #fff;
      font-family: inherit;
      font-weight: 800;
      font-size: 1.1rem;
      padding: 14px 28px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(139,92,246,0.4); }
    .btn-outline { background: #0f172a; border: 2px solid var(--card-border); }
    .opt-btn {
      background: #1e293b;
      border: 2px solid var(--card-border);
      border-radius: 14px;
      padding: 15px 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .opt-btn:hover { border-color: #c084fc; transform: translateX(4px); }
    .opt-btn.selected { border-color: #c084fc; background: rgba(192, 132, 252, 0.25); }
    .opt-letter {
      width: 36px; height: 36px; border-radius: 50%;
      border: 2px solid #64748b;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; color: #94a3b8;
    }
    .opt-btn.selected .opt-letter { background: #c084fc; border-color: #c084fc; color: #090d16; }
    .opt-text { font-size: 1.1rem; font-weight: 600; color: #f1f5f9; }
    .stem-box {
      background: #090d16;
      border: 2px solid var(--card-border);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 24px;
      text-align: center;
    }
    .stem-word { font-size: 2.4rem; font-weight: 900; color: #c084fc; letter-spacing: 0.05em; }
    .stem-sentence { font-size: 1.25rem; font-weight: 600; color: #fff; text-align: left; line-height: 1.8; }
    .timer-badge { font-family: 'JetBrains Mono', monospace; font-size: 1.3rem; font-weight: 800; color: #c084fc; }
  </style>
</head>
<body>

  <header class="header">
    <div style="font-weight: 900; font-size: 1.3rem; color: #c084fc; cursor: pointer;" onclick="location.href='index.html'">
      ⚡ ISEE Middle Level Verbal Prep
    </div>
    <div id="topTimer" class="timer-badge" style="display: none;">⏳ 30:00</div>
  </header>

  <div class="container">
    
    <!-- Intro Screen -->
    <div id="screenStart" class="screen active">
      <div class="card" style="max-width: 700px; text-align: center;">
        <h2 style="font-size: 2.2rem; font-weight: 900; margin-bottom: 12px;">ISEE Middle Level Verbal Test</h2>
        <p style="color: #cbd5e1; font-size: 1.05rem; margin-bottom: 24px;">
          4 Answer Choices (A, B, C, D) • Synonyms & Sentence Completions • 50 Questions • 30 Minutes
        </p>
        <button class="btn" style="width: 100%; justify-content: center; font-size: 1.3rem; padding: 18px;" onclick="startTest()">
          🚀 Begin Test (30 Min Timer)
        </button>
      </div>
    </div>

    <!-- Test Screen -->
    <div id="screenTest" class="screen">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <strong id="qNumberDisplay" style="color: #c084fc; font-size: 1.15rem;">Question 1 of 50</strong>
          <span id="qSectionDisplay" style="color: #38bdf8; font-weight: 800; font-size: 0.85rem;">SYNONYMS</span>
        </div>

        <div id="stemDisplay" class="stem-box"></div>
        <div id="optionsDisplay"></div>

        <div style="display: flex; justify-content: space-between; margin-top: 24px;">
          <button id="btnPrev" class="btn btn-outline" onclick="step(-1)">← Previous</button>
          <div style="display: flex; gap: 10px;">
            <button class="btn btn-outline" style="border-color: #ef4444; color: #ef4444;" onclick="finishTest()">🏁 Finish & Score</button>
            <button id="btnNext" class="btn" onclick="step(1)">Next →</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Score Screen -->
    <div id="screenScore" class="screen">
      <div class="card" style="text-align: center;">
        <h2 style="font-size: 2.5rem; font-weight: 900; margin-bottom: 8px;">Test Complete!</h2>
        <div style="font-size: 4rem; font-weight: 900; color: #10b981; font-family: 'JetBrains Mono', monospace;" id="scoreSummary">47 / 50</div>
        <p id="scorePercent" style="font-size: 1.2rem; color: #cbd5e1; margin-bottom: 24px;">94% Correct • Stanine 9 (Superior Mastery)</p>
        <button class="btn" onclick="location.reload()">🔄 Take Test Again</button>
        <button class="btn btn-outline" onclick="location.href='index.html'" style="margin-left: 10px;">🏠 Back to Main Portal</button>
      </div>
      <div id="breakdownContainer"></div>
    </div>

  </div>

  <script>
    const ISEE_CORE_DICTIONARY = [
      ["ABRUPT", "sudden", ["gentle", "polite", "delayed", "gradual", "smooth", "patient"], "happening suddenly and without warning"],
      ["ADAPT", "adjust", ["reject", "destroy", "copy", "refuse", "halt", "freeze"], "to adjust to new conditions"],
      ["ANXIOUS", "nervous", ["relaxed", "furious", "cheerful", "calm", "confident", "composed"], "feeling worried, uneasy, or nervous"],
      ["BARREN", "lifeless", ["fruitful", "crowded", "damp", "lush", "fertile", "vibrant"], "empty, sterile, or lifeless"],
      ["BRAGGART", "show-off", ["listener", "scholar", "servant", "humble person", "modest student"], "a person who boasts or shows off"],
      ["CAPRICIOUS", "fickle", ["predictable", "stubborn", "cautious", "steady", "reliable"], "impulsive, erratic, or fickle"],
      ["CONCISE", "brief", ["lengthy", "confusing", "loud", "wordy", "rambling"], "giving much info in few, brief words"],
      ["CONTROVERSIAL", "debatable", ["undisputed", "peaceful", "pleasant", "unquestioned", "accepted"], "debatable and causing dispute"],
      ["DRASTIC", "extreme", ["mild", "gradual", "fragile", "gentle", "moderate"], "radical, severe, or extreme"],
      ["DURATION", "lifespan", ["distance", "weight", "speed", "height", "area"], "the length of time something lasts"],
      ["ECONOMIZE", "save", ["spend", "waste", "donate", "squander", "destroy"], "to cut expenses and save resources"],
      ["ENDEAVOR", "attempt", ["hesitation", "mistake", "surrender", "inaction", "retreat"], "an earnest effort or attempt"],
      ["FALTER", "stumble", ["steady", "charge", "conquer", "succeed", "advance"], "to hesitate, lose strength, or stumble"],
      ["FLOURISH", "prosper", ["wither", "collapse", "pause", "decline", "deteriorate"], "to grow vigorously and prosper"],
      ["GRATIFIED", "pleased", ["annoyed", "exhausted", "frightened", "disappointed", "bitter"], "feeling satisfied and pleased"],
      ["GULLIBLE", "easily tricked", ["skeptical", "observant", "intelligent", "wary", "shrewd"], "easily tricked or naive"],
      ["HAPHAZARD", "random", ["organized", "punctual", "cautious", "systematic", "methodical"], "random and lacking organization"],
      ["HOMELY", "plain", ["glamorous", "majestic", "expensive", "gorgeous", "fancy"], "simple, unadorned, or plain"],
      ["INCIDENT", "event", ["planning", "silence", "theory", "delay", "routine"], "an individual event or occurrence"],
      ["INUNDATE", "overwhelm", ["drain", "uncover", "ignite", "dry", "clear"], "to flood or overwhelm with things"],
      ["IRATE", "furious", ["cheerful", "calm", "curious", "peaceful", "friendly"], "extremely angry or furious"],
      ["JOVIAL", "merry", ["gloomy", "strict", "timid", "somber", "miserable"], "cheerful, friendly, and merry"],
      ["KEEN", "sharp", ["blunt", "careless", "lazy", "dull", "obtuse"], "sharp in intellect or perception"],
      ["KNACK", "talent", ["weakness", "accident", "penalty", "inability", "clumsiness"], "a special skill or talent"],
      ["LOFTY", "towering", ["modest", "narrow", "deep", "low", "humble"], "towering, majestic, or high"],
      ["LURE", "entice", ["repel", "frighten", "warn", "reject", "discourage"], "to entice, tempt, or attract"],
      ["MEAGER", "scanty", ["plentiful", "luxurious", "vibrant", "abundant", "rich"], "small in quantity and insufficient"],
      ["MIMIC", "imitate", ["originate", "destroy", "avoid", "invent", "create"], "to imitate or copy closely"],
      ["NONCOMMITTAL", "evasive", ["decisive", "furious", "boastful", "direct", "firm"], "not expressing a clear, decisive opinion"],
      ["NOTORIOUS", "infamous", ["unknown", "admired", "fragile", "honored", "revered"], "famous for bad deeds; infamous"],
      ["OBSTINATE", "stubborn", ["jovial", "adaptable", "weary", "flexible", "agreeable"], "stubbornly refusing to yield"],
      ["OMIT", "exclude", ["include", "praise", "illuminate", "welcome", "retain"], "to leave out or exclude"],
      ["PEAK", "summit", ["base", "burrow", "valley", "bottom", "plain"], "the pointed summit or top of a mountain"],
      ["PREDICAMENT", "dilemma", ["benefit", "celebration", "sanctuary", "fortune", "advantage"], "a troublesome, perplexing situation or dilemma"],
      ["PRESUME", "assume", ["prove", "regret", "prohibit", "verify", "confirm"], "to take for granted without proof; assume"],
      ["QUEST", "journey", ["duration", "contradiction", "decline", "pause", "retreat"], "a long, heroic journey or search"],
      ["REVERE", "honor", ["mock", "taunt", "abandon", "scorn", "criticize"], "to hold in deep, respectful admiration"],
      ["ROBUST", "sturdy", ["fragile", "shabby", "meager", "weak", "flimsy"], "strong, sturdy, and durable"],
      ["SOOTHE", "calm", ["agitate", "petrify", "falter", "inflame", "provoke"], "to gently calm and relieve distress"],
      ["STEADFAST", "loyal", ["fickle", "capricious", "noncommittal", "hesitant", "unreliable"], "unwavering, loyal, and devoted"],
      ["SUBTLE", "delicate", ["obvious", "drastic", "blunt", "harsh", "glaring"], "faint, delicate, and understated details"],
      ["TANGIBLE", "concrete", ["imaginary", "vague", "doubtful", "abstract", "illusory"], "physical, measurable, and concrete"],
      ["THRIVE", "flourish", ["perish", "falter", "decline", "wither", "decay"], "to grow vigorously and flourish"],
      ["UNRULY", "disorderly", ["obedient", "quiet", "polite", "docile", "disciplined"], "disruptive, rowdy, and disorderly"],
      ["URGENT", "critical", ["casual", "sluggish", "obsolete", "trivial", "relaxed"], "requiring immediate action; critical"],
      ["VIBRANT", "energetic", ["drab", "barren", "mournful", "dull", "lifeless"], "colorful, lively, and full of energy"],
      ["VIGOROUS", "strenuous", ["lazy", "delicate", "gentle", "feeble", "sluggish"], "energetic, forceful, and strenuous"],
      ["WILLFUL", "headstrong", ["cooperative", "timid", "generous", "obedient", "yielding"], "stubbornly determined to have one's way"],
      ["WRATH", "fury", ["kindness", "mercy", "gratitude", "calmness", "delight"], "fierce, intense anger or fury"],
      ["YEARN", "crave", ["dread", "refuse", "conceal", "dislike", "hate"], "to long for, crave, or desire intensely"]
    ];

    const ISEE_SENTENCE_FRAMES = [
      { frame: "The fisherman used colorful lures to _______ trout into his net.", word: "attract", options: ["repel", "frighten", "warn"], exp: "To attract means to draw or lure something closer." },
      { frame: "Because the hikers had only a _______ supply of water left, they rationed every drop.", word: "scanty", options: ["plentiful", "luxurious", "vibrant"], exp: "Scanty (meager) means small in quantity." },
      { frame: "The clever parrot was able to _______ the sound of the doorbell with astonishing accuracy.", word: "imitate", options: ["omit", "destroy", "avoid"], exp: "To imitate means to mimic or copy." },
      { frame: "The politician gave a _______ answer so as not to alienate either side of the issue.", word: "noncommittal", options: ["decisive", "furious", "boastful"], exp: "Noncommittal means refusing to take a clear stance." },
      { frame: "The bandit was _______ throughout the territory for his daring bank heists.", word: "infamous", options: ["unknown", "admired", "fragile"], exp: "Infamous (notorious) means famous for bad deeds." },
      { frame: "Despite everyone begging him to budge, the _______ donkey refused to take a step.", word: "stubborn", options: ["jovial", "adaptable", "weary"], exp: "Stubborn (obstinate) means unyielding." },
      { frame: "Maya realized she had accidentally _______ an important paragraph from her report.", word: "excluded", options: ["praised", "illuminated", "revered"], exp: "To exclude (omit) means to leave out." },
      { frame: "After climbing for eight grueling hours, the hikers reached the snowy _______.", word: "summit", options: ["base", "burrow", "valley"], exp: "The summit (peak) is the top of a mountain." },
      { frame: "Getting locked out of his home in the heavy rain was an annoying _______.", word: "dilemma", ["benefit", "celebration", "sanctuary"], exp: "A dilemma (predicament) is a troublesome situation." },
      { frame: "You should not simply _______ that the train will arrive on schedule without checking.", word: "assume", options: ["prove", "regret", "prohibit"], exp: "To assume (presume) means to take for granted without proof." },
      { frame: "The brave knight embarked on a dangerous _______ to recover the lost artifact.", word: "quest", options: ["duration", "contradiction", "decline"], exp: "A quest is a heroic search or journey." },
      { frame: "In ancient times, citizens would deeply _______ their elders for their wisdom.", word: "honor", options: ["mock", "taunt", "abandon"], exp: "To honor (revere) means to show deep respect." },
      { frame: "With reinforced concrete and steel pillars, the bridge was remarkably _______.", word: "sturdy", options: ["fragile", "shabby", "meager"], exp: "Sturdy (robust) means durable and well-built." },
      { frame: "The harpist played a gentle lullaby to _______ the crying toddler to sleep.", word: "soothe", options: ["agitate", "petrify", "falter"], exp: "To soothe means to calm or comfort." },
      { frame: "Marcus remained a _______ companion through all of life's unpredictable trials.", word: "steadfast", options: ["fickle", "capricious", "noncommittal"], exp: "Steadfast means loyal and unwavering." },
      { frame: "The artist created _______ shifts in shading that only careful observers noticed.", word: "delicate", options: ["obvious", "drastic", "blunt"], exp: "Delicate (subtle) describes understated nuances." },
      { frame: "The detective insisted on seeing _______ proof before filing charges against the suspect.", word: "concrete", options: ["imaginary", "vague", "doubtful"], exp: "Concrete (tangible) means measurable and physical." },
      { frame: "With fertile soil and regular watering, the exotic orchids began to _______.", word: "flourish", options: ["perish", "falter", "decline"], exp: "To flourish (thrive) means to grow vigorously." },
      { frame: "The teacher tried to manage the _______ children who were shouting loudly.", word: "disorderly", options: ["obedient", "quiet", "polite"], exp: "Disorderly (unruly) means chaotic and disruptive." },
      { frame: "When the siren wailed, the fire captain gave an _______ order to evacuate the plant.", word: "urgent", options: ["casual", "sluggish", "obsolete"], exp: "Urgent means requiring immediate action." },
      { frame: "The carnival was filled with _______ performers dressed in bright, dazzling costumes.", word: "vibrant", options: ["drab", "barren", "mournful"], exp: "Vibrant means lively and bright." },
      { frame: "The athletes completed a _______ morning routine of running and conditioning.", word: "vigorous", options: ["lazy", "delicate", "gentle"], exp: "Vigorous means energetic and demanding." },
      { frame: "The _______ toddler refused to put on his winter coat before going outside.", word: "willful", options: ["cooperative", "timid", "generous"], exp: "Willful means stubbornly headstrong." },
      { frame: "The thunderstorm unleashed its furious _______ across the coastal town.", word: "wrath", options: ["kindness", "mercy", "gratitude"], exp: "Wrath means severe fury." },
      { frame: "After months away at camp, Sarah began to _______ for her family's cooking.", word: "yearn", options: ["dread", "refuse", "conceal"], exp: "To yearn means to crave or long for deeply." }
    ];

    function generateUniqueISEESet(count = 50) {
      const letters = ['A', 'B', 'C', 'D'];
      const numSyn = Math.floor(count / 2);
      const numSent = count - numSyn;
      const result = [];

      // 1. Pick distinct synonyms
      const shuffledWords = [...ISEE_CORE_DICTIONARY].sort(() => 0.5 - Math.random());
      const selectedWords = shuffledWords.slice(0, Math.min(numSyn, shuffledWords.length));

      selectedWords.forEach((entry, idx) => {
        const [word, correctSyn, distractors, meaning] = entry;
        const shuffledDist = [...distractors].sort(() => 0.5 - Math.random()).slice(0, 3);
        const rawChoices = [{ text: correctSyn, correct: true }, ...shuffledDist.map(d => ({ text: d, correct: false }))];
        const shuffledChoices = rawChoices.sort(() => 0.5 - Math.random());
        const correctLetter = letters[shuffledChoices.findIndex(c => c.correct)];

        result.push({
          id: idx + 1,
          type: "synonym",
          section: "PART 1: SYNONYMS",
          prompt: word,
          choices: shuffledChoices.map((c, i) => ({ text: c.text, key: letters[i] })),
          answer: correctLetter,
          explanation: `${word} means ${meaning}. Therefore, "${correctSyn.toUpperCase()}" is the correct synonym.`
        });
      });

      // 2. Pick distinct sentence completions
      const shuffledSentences = [...ISEE_SENTENCE_FRAMES].sort(() => 0.5 - Math.random());
      const selectedSentences = shuffledSentences.slice(0, Math.min(numSent, shuffledSentences.length));

      selectedSentences.forEach((sItem, idx) => {
        const rawChoices = [{ text: sItem.word, correct: true }, ...sItem.options.slice(0, 3).map(o => ({ text: o, correct: false }))];
        const shuffledChoices = rawChoices.sort(() => 0.5 - Math.random());
        const correctLetter = letters[shuffledChoices.findIndex(c => c.correct)];

        result.push({
          id: result.length + 1,
          type: "sentence",
          section: "PART 2: SENTENCE COMPLETION",
          prompt: sItem.frame,
          choices: shuffledChoices.map((c, i) => ({ text: c.text, key: letters[i] })),
          answer: correctLetter,
          explanation: sItem.exp
        });
      });

      return result;
    }

    let QUESTIONS = [];
    let current = 0;
    let answers = [];
    let timeLeft = 1800;
    let timer = null;

    function startTest() {
      // Guaranteed 100% Unique, Non-Repeating 50-Question Exam Set
      QUESTIONS = generateUniqueISEESet(50);

      answers = new Array(QUESTIONS.length).fill(null);
      current = 0;
      timeLeft = 1800;
      document.getElementById('topTimer').style.display = 'block';
      renderQ();
      showScreen('screenTest');

      timer = setInterval(() => {
        timeLeft--;
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        document.getElementById('topTimer').textContent = `⏳ ${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        if (timeLeft <= 0) finishTest();
      }, 1000);
    }

    function renderQ() {
      const q = QUESTIONS[current];
      document.getElementById('qNumberDisplay').textContent = `Question ${current + 1} of ${QUESTIONS.length}`;
      document.getElementById('qSectionDisplay').textContent = q.section;

      const stem = document.getElementById('stemDisplay');
      if (q.type === 'synonym') {
        stem.innerHTML = `<div style="font-size:0.85rem; color:#94a3b8; text-transform:uppercase; margin-bottom:6px;">Synonym of:</div><div class="stem-word">${q.prompt}</div>`;
      } else {
        stem.innerHTML = `<div style="font-size:0.85rem; color:#94a3b8; text-transform:uppercase; margin-bottom:6px;">Complete Sentence:</div><div class="stem-sentence">${q.prompt.replace("_______", "<strong style='color:#c084fc;'>[ ______ ]</strong>")}</div>`;
      }

      const opts = document.getElementById('optionsDisplay');
      opts.innerHTML = '';
      q.choices.forEach(c => {
        const div = document.createElement('div');
        div.className = `opt-btn ${answers[current] === c.key ? 'selected' : ''}`;
        div.onclick = () => {
          answers[current] = c.key;
          renderQ();
        };
        div.innerHTML = `<div class="opt-letter">${c.key}</div><div class="opt-text">${c.text}</div>`;
        opts.appendChild(div);
      });

      document.getElementById('btnPrev').disabled = current === 0;
      document.getElementById('btnNext').textContent = (current === QUESTIONS.length - 1) ? "Review" : "Next →";
    }

    function step(d) {
      if (d === 1 && current < QUESTIONS.length - 1) { current++; renderQ(); }
      else if (d === -1 && current > 0) { current--; renderQ(); }
    }

    function finishTest() {
      if (timer) clearInterval(timer);
      document.getElementById('topTimer').style.display = 'none';
      let correct = 0;
      for (let i = 0; i < QUESTIONS.length; i++) {
        if (answers[i] === QUESTIONS[i].answer) correct++;
      }
      document.getElementById('scoreSummary').textContent = `${correct} / ${QUESTIONS.length}`;
      document.getElementById('scorePercent').textContent = `${Math.round((correct/QUESTIONS.length)*100)}% Correct • Stanine 9 (Superior Mastery)`;

      const b = document.getElementById('breakdownContainer');
      b.innerHTML = '';
      QUESTIONS.forEach((q, i) => {
        const isRight = answers[i] === q.answer;
        const div = document.createElement('div');
        div.className = 'card';
        div.style.padding = '18px';
        div.style.borderLeft = isRight ? '6px solid var(--success)' : '6px solid var(--danger)';
        div.innerHTML = `
          <div style="font-weight:800; color:#c084fc;">Question ${i+1} (${q.type.toUpperCase()})</div>
          <div>Your Answer: ${answers[i] || 'None'} | Correct: <strong style="color:var(--success)">(${q.answer})</strong></div>
          <div style="margin-top:6px; font-size:0.9rem; color:#cbd5e1;">💡 ${q.explanation}</div>
        `;
        b.appendChild(div);
      });

      showScreen('screenScore');
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }
  </script>
</body>
</html>
