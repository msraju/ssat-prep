<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISEE Middle Level Verbal Practice Test • 4 Choices</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #8b5cf6;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --bg: #090d16;
      --card-bg: rgba(30, 41, 59, 0.9);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }
    .header {
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 2px solid var(--card-border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .container { max-width: 1000px; margin: 0 auto; padding: 24px; }
    .screen { display: none; }
    .screen.active { display: block; }
    .card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 24px;
      padding: 32px;
      margin: 20px auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .btn {
      background: linear-gradient(135deg, #8b5cf6, #c084fc);
      color: #fff;
      font-family: inherit;
      font-weight: 800;
      font-size: 1.1rem;
      padding: 14px 28px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(139,92,246,0.4); }
    .btn-outline { background: #0f172a; border: 2px solid var(--card-border); }
    .opt-btn {
      background: #1e293b;
      border: 2px solid var(--card-border);
      border-radius: 14px;
      padding: 15px 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .opt-btn:hover { border-color: #c084fc; transform: translateX(4px); }
    .opt-btn.selected { border-color: #c084fc; background: rgba(192, 132, 252, 0.25); }
    .opt-letter {
      width: 36px; height: 36px; border-radius: 50%;
      border: 2px solid #64748b;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; color: #94a3b8;
    }
    .opt-btn.selected .opt-letter { background: #c084fc; border-color: #c084fc; color: #090d16; }
    .opt-text { font-size: 1.1rem; font-weight: 600; color: #f1f5f9; }
    .stem-box {
      background: #090d16;
      border: 2px solid var(--card-border);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 24px;
      text-align: center;
    }
    .stem-word { font-size: 2.4rem; font-weight: 900; color: #c084fc; letter-spacing: 0.05em; }
    .stem-sentence { font-size: 1.25rem; font-weight: 600; color: #fff; text-align: left; line-height: 1.8; }
    .timer-badge { font-family: 'JetBrains Mono', monospace; font-size: 1.3rem; font-weight: 800; color: #c084fc; }
  </style>
</head>
<body>

  <header class="header">
    <div style="font-weight: 900; font-size: 1.3rem; color: #c084fc; cursor: pointer;" onclick="location.href='index.html'">
      ⚡ ISEE Middle Level Verbal Prep
    </div>
    <div id="topTimer" class="timer-badge" style="display: none;">⏳ 30:00</div>
  </header>

  <div class="container">
    
    <!-- Intro Screen -->
    <div id="screenStart" class="screen active">
      <div class="card" style="max-width: 700px; text-align: center;">
        <h2 style="font-size: 2.2rem; font-weight: 900; margin-bottom: 12px;">ISEE Middle Level Verbal Test</h2>
        <p style="color: #cbd5e1; font-size: 1.05rem; margin-bottom: 24px;">
          4 Answer Choices (A, B, C, D) • Synonyms & Sentence Completions • 50 Questions • 30 Minutes
        </p>
        <button class="btn" style="width: 100%; justify-content: center; font-size: 1.3rem; padding: 18px;" onclick="startTest()">
          🚀 Begin Test (30 Min Timer)
        </button>
      </div>
    </div>

    <!-- Test Screen -->
    <div id="screenTest" class="screen">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <strong id="qNumberDisplay" style="color: #c084fc; font-size: 1.15rem;">Question 1 of 50</strong>
          <span id="qSectionDisplay" style="color: #38bdf8; font-weight: 800; font-size: 0.85rem;">SYNONYMS</span>
        </div>

        <div id="stemDisplay" class="stem-box"></div>
        <div id="optionsDisplay"></div>

        <div style="display: flex; justify-content: space-between; margin-top: 24px;">
          <button id="btnPrev" class="btn btn-outline" onclick="step(-1)">← Previous</button>
          <div style="display: flex; gap: 10px;">
            <button class="btn btn-outline" style="border-color: #ef4444; color: #ef4444;" onclick="finishTest()">🏁 Finish & Score</button>
            <button id="btnNext" class="btn" onclick="step(1)">Next →</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Score Screen -->
    <div id="screenScore" class="screen">
      <div class="card" style="text-align: center;">
        <h2 style="font-size: 2.5rem; font-weight: 900; margin-bottom: 8px;">Test Complete!</h2>
        <div style="font-size: 4rem; font-weight: 900; color: #10b981; font-family: 'JetBrains Mono', monospace;" id="scoreSummary">47 / 50</div>
        <p id="scorePercent" style="font-size: 1.2rem; color: #cbd5e1; margin-bottom: 24px;">94% Correct • Stanine 9 (Superior Mastery)</p>
        <button class="btn" onclick="location.reload()">🔄 Take Test Again</button>
        <button class="btn btn-outline" onclick="location.href='index.html'" style="margin-left: 10px;">🏠 Back to Main Portal</button>
      </div>
      <div id="breakdownContainer"></div>
    </div>

  </div>

  <script>
    const QUESTIONS = [
      { id: 1, type: "synonym", section: "PART 1: SYNONYMS", prompt: "ABRUPT", choices: [{ text: "sudden", key: "A" }, { text: "gentle", key: "B" }, { text: "polite", key: "C" }, { text: "delayed", key: "D" }], answer: "A", explanation: "ABRUPT means sudden and unexpected." },
      { id: 2, type: "synonym", section: "PART 1: SYNONYMS", prompt: "ADAPT", choices: [{ text: "reject", key: "A" }, { text: "adjust", key: "B" }, { text: "destroy", key: "C" }, { text: "copy", key: "D" }], answer: "B", explanation: "ADAPT means to adjust to new conditions." },
      { id: 3, type: "synonym", section: "PART 1: SYNONYMS", prompt: "ANXIOUS", choices: [{ text: "relaxed", key: "A" }, { text: "nervous", key: "B" }, { text: "furious", key: "C" }, { text: "cheerful", key: "D" }], answer: "B", explanation: "ANXIOUS means nervous or worried." },
      { id: 4, type: "synonym", section: "PART 1: SYNONYMS", prompt: "BARREN", choices: [{ text: "fruitful", key: "A" }, { text: "lifeless", key: "B" }, { text: "crowded", key: "C" }, { text: "damp", key: "D" }], answer: "B", explanation: "BARREN land is lifeless and sterile." },
      { id: 5, type: "synonym", section: "PART 1: SYNONYMS", prompt: "BRAGGART", choices: [{ text: "show-off", key: "A" }, { text: "listener", key: "B" }, { text: "scholar", key: "C" }, { text: "servant", key: "D" }], answer: "A", explanation: "A BRAGGART is a show-off." },
      { id: 6, type: "synonym", section: "PART 1: SYNONYMS", prompt: "CAPRICIOUS", choices: [{ text: "predictable", key: "A" }, { text: "fickle", key: "B" }, { text: "stubborn", key: "C" }, { text: "cautious", key: "D" }], answer: "B", explanation: "CAPRICIOUS means fickle and impulsive." },
      { id: 7, type: "synonym", section: "PART 1: SYNONYMS", prompt: "CONCISE", choices: [{ text: "lengthy", key: "A" }, { text: "brief", key: "B" }, { text: "confusing", key: "C" }, { text: "loud", key: "D" }], answer: "B", explanation: "CONCISE means brief and to the point." },
      { id: 8, type: "synonym", section: "PART 1: SYNONYMS", prompt: "CONTROVERSIAL", choices: [{ text: "undisputed", key: "A" }, { text: "debatable", key: "B" }, { text: "peaceful", key: "C" }, { text: "pleasant", key: "D" }], answer: "B", explanation: "CONTROVERSIAL means debatable." },
      { id: 9, type: "synonym", section: "PART 1: SYNONYMS", prompt: "DRASTIC", choices: [{ text: "extreme", key: "A" }, { text: "mild", key: "B" }, { text: "gradual", key: "C" }, { text: "fragile", key: "D" }], answer: "A", explanation: "DRASTIC means extreme or severe." },
      { id: 10, type: "synonym", section: "PART 1: SYNONYMS", prompt: "DURATION", choices: [{ text: "distance", key: "A" }, { text: "lifespan", key: "B" }, { text: "weight", key: "C" }, { text: "speed", key: "D" }], answer: "B", explanation: "DURATION refers to the lifespan/length of time." },
      { id: 11, type: "sentence", section: "PART 2: SENTENCE COMPLETION", prompt: "The fisherman used shiny, colorful bait to _______ trout into his net.", choices: [{ text: "repel", key: "A" }, { text: "lure", key: "B" }, { text: "frighten", key: "C" }, { text: "warn", key: "D" }], answer: "B", explanation: "To LURE means to attract." },
      { id: 12, type: "sentence", section: "PART 2: SENTENCE COMPLETION", prompt: "Because the travelers had only a _______ supply of fresh water left, they were forced to ration every sip.", choices: [{ text: "meager", key: "A" }, { text: "plentiful", key: "B" }, { text: "luxurious", key: "C" }, { text: "vibrant", key: "D" }], answer: "A", explanation: "MEAGER means small and insufficient." },
      { id: 13, type: "sentence", section: "PART 2: SENTENCE COMPLETION", prompt: "The clever parrot was able to _______ the sound of the ringing telephone with astonishing accuracy.", choices: [{ text: "omit", key: "A" }, { text: "mimic", key: "B" }, { text: "destroy", key: "C" }, { text: "avoid", key: "D" }], answer: "B", explanation: "To MIMIC is to imitate." },
      { id: 14, type: "sentence", section: "PART 2: SENTENCE COMPLETION", prompt: "The bandit was _______ throughout the region for his daring stagecoach robberies.", choices: [{ text: "unknown", key: "A" }, { text: "notorious", key: "B" }, { text: "admired", key: "C" }, { text: "fragile", key: "D" }], answer: "B", explanation: "NOTORIOUS means famous for bad deeds." },
      { id: 15, type: "sentence", section: "PART 2: SENTENCE COMPLETION", prompt: "Despite everyone begging him to compromise, the _______ donkey refused to take a single step forward.", choices: [{ text: "jovial", key: "A" }, { text: "obstinate", key: "B" }, { text: "adaptable", key: "C" }, { text: "weary", key: "D" }], answer: "B", explanation: "OBSTINATE means stubborn." }
    ];

    let current = 0;
    let answers = [];
    let timeLeft = 1800;
    let timer = null;

    function startTest() {
      answers = new Array(QUESTIONS.length).fill(null);
      current = 0;
      timeLeft = 1800;
      document.getElementById('topTimer').style.display = 'block';
      renderQ();
      showScreen('screenTest');

      timer = setInterval(() => {
        timeLeft--;
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        document.getElementById('topTimer').textContent = `⏳ ${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        if (timeLeft <= 0) finishTest();
      }, 1000);
    }

    function renderQ() {
      const q = QUESTIONS[current];
      document.getElementById('qNumberDisplay').textContent = `Question ${current + 1} of ${QUESTIONS.length}`;
      document.getElementById('qSectionDisplay').textContent = q.section;

      const stem = document.getElementById('stemDisplay');
      if (q.type === 'synonym') {
        stem.innerHTML = `<div style="font-size:0.85rem; color:#94a3b8; text-transform:uppercase; margin-bottom:6px;">Synonym of:</div><div class="stem-word">${q.prompt}</div>`;
      } else {
        stem.innerHTML = `<div style="font-size:0.85rem; color:#94a3b8; text-transform:uppercase; margin-bottom:6px;">Complete Sentence:</div><div class="stem-sentence">${q.prompt.replace("_______", "<strong style='color:#c084fc;'>[ ______ ]</strong>")}</div>`;
      }

      const opts = document.getElementById('optionsDisplay');
      opts.innerHTML = '';
      q.choices.forEach(c => {
        const div = document.createElement('div');
        div.className = `opt-btn ${answers[current] === c.key ? 'selected' : ''}`;
        div.onclick = () => {
          answers[current] = c.key;
          renderQ();
        };
        div.innerHTML = `<div class="opt-letter">${c.key}</div><div class="opt-text">${c.text}</div>`;
        opts.appendChild(div);
      });

      document.getElementById('btnPrev').disabled = current === 0;
      document.getElementById('btnNext').textContent = (current === QUESTIONS.length - 1) ? "Review" : "Next →";
    }

    function step(d) {
      if (d === 1 && current < QUESTIONS.length - 1) { current++; renderQ(); }
      else if (d === -1 && current > 0) { current--; renderQ(); }
    }

    function finishTest() {
      if (timer) clearInterval(timer);
      document.getElementById('topTimer').style.display = 'none';
      let correct = 0;
      for (let i = 0; i < QUESTIONS.length; i++) {
        if (answers[i] === QUESTIONS[i].answer) correct++;
      }
      document.getElementById('scoreSummary').textContent = `${correct} / ${QUESTIONS.length}`;
      document.getElementById('scorePercent').textContent = `${Math.round((correct/QUESTIONS.length)*100)}% Correct • Stanine 9 (Superior Mastery)`;

      const b = document.getElementById('breakdownContainer');
      b.innerHTML = '';
      QUESTIONS.forEach((q, i) => {
        const isRight = answers[i] === q.answer;
        const div = document.createElement('div');
        div.className = 'card';
        div.style.padding = '18px';
        div.style.borderLeft = isRight ? '6px solid var(--success)' : '6px solid var(--danger)';
        div.innerHTML = `
          <div style="font-weight:800; color:#c084fc;">Question ${i+1} (${q.type.toUpperCase()})</div>
          <div>Your Answer: ${answers[i] || 'None'} | Correct: <strong style="color:var(--success)">(${q.answer})</strong></div>
          <div style="margin-top:6px; font-size:0.9rem; color:#cbd5e1;">💡 ${q.explanation}</div>
        `;
        b.appendChild(div);
      });

      showScreen('screenScore');
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }
  </script>
</body>
</html>
