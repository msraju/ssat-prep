      { stem: "TAUNT is to INSULT as", target: "praise is to compliment", distractors: ["debate is to agree", "conceal is to show", "liberate is to capture", "uproot is to plant"], exp: "Synonyms: To TAUNT is to INSULT, as to PRAISE is to COMPLIMENT." },
      { stem: "SELDOM is to OFTEN as", target: "rarely is to frequently", distractors: ["vivid is to bright", "weary is to tired", "generous is to giving", "valiant is to brave"], exp: "Degree: SELDOM is opposite of OFTEN, as RARELY is opposite of FREQUENTLY." },
      { stem: "QUEASY is to STOMACH as", target: "dizzy is to head", distractors: ["blunt is to pencil", "valiant is to knight", "fragile is to glass", "shabby is to coat"], exp: "Sensation: QUEASY affects the STOMACH, as DIZZY affects the HEAD." },
      { stem: "LIBERATE is to PRISONER as", target: "heal is to patient", distractors: ["cage is to animal", "taunt is to friend", "demolish is to wall", "conceal is to truth"], exp: "Action to Beneficiary: LIBERATE helps a PRISONER, as HEAL helps a PATIENT." },
      { stem: "VALIANT is to HERO as", target: "cowardly is to traitor", distractors: ["generous is to thief", "zany is to judge", "blunt is to needle", "queasy is to athlete"], exp: "Trait: A HERO is VALIANT, as a TRAITOR is COWARDLY." },
      { stem: "SCALPEL is to SURGEON as", target: "chisel is to sculptor", distractors: ["paintbrush is to driver", "hammer is to teacher", "pen is to astronaut", "needle is to baker"], exp: "Tool to Worker: A SCALPEL is used by a SURGEON, as a CHISEL is used by a SCULPTOR." },
      { stem: "AQUARIUM is to FISH as", target: "terrarium is to reptile", distractors: ["cage is to cloud", "nest is to lion", "barn is to whale", "kennel is to eagle"], exp: "Habitat: An AQUARIUM holds FISH, as a TERRARIUM holds REPTILES." },
      { stem: "GLOVE is to HAND as", target: "sock is to foot", distractors: ["hat is to shoe", "belt is to neck", "ring is to wrist", "scarf is to ankle"], exp: "Apparel: A GLOVE covers a HAND, as a SOCK covers a FOOT." },
      { stem: "DESERT is to ARID as", target: "swamp is to humid", distractors: ["ocean is to dry", "mountain is to flat", "jungle is to frozen", "prairie is to salty"], exp: "Environment: A DESERT is ARID, as a SWAMP is HUMID." },
      { stem: "MICROPHONE is to AMPLIFY as", target: "microscope is to magnify", distractors: ["telescope is to darken", "camera is to erase", "compass is to confuse", "thermometer is to chill"], exp: "Tool: A MICROPHONE AMPLIFIES sound, as a MICROSCOPE MAGNIFIES images." }
    ];

    function generateUniqueSSATSet(count = 50) {
      const letters = ['A', 'B', 'C', 'D', 'E'];
      const numSyn = Math.floor(count / 2);
      const numAnalogies = count - numSyn;
      const result = [];

      // 1. Pick distinct synonyms (Zero duplicate root words)
      const shuffledWords = [...SSAT_CORE_DICTIONARY].sort(() => 0.5 - Math.random());
      const selectedWords = shuffledWords.slice(0, Math.min(numSyn, shuffledWords.length));

      selectedWords.forEach((entry, idx) => {
        const [word, correctSyn, distractors, meaning] = entry;
        const shuffledDist = [...distractors].sort(() => 0.5 - Math.random()).slice(0, 4);
        const rawChoices = [{ text: correctSyn, correct: true }, ...shuffledDist.map(d => ({ text: d, correct: false }))];
        const shuffledChoices = rawChoices.sort(() => 0.5 - Math.random());
        const correctLetter = letters[shuffledChoices.findIndex(c => c.correct)];

        result.push({
          id: idx + 1,
          type: "synonym",
          section: "PART 1: SYNONYMS",
          prompt: word,
          choices: shuffledChoices.map((c, i) => ({ text: c.text, key: letters[i] })),
          answer: correctLetter,
          explanation: `${word} means ${meaning}. Therefore, "${correctSyn.toUpperCase()}" is the correct synonym.`
        });
      });

      // 2. Pick distinct analogies (Zero duplicate relationships)
      const shuffledAnalogies = [...SSAT_ANALOGY_TEMPLATES].sort(() => 0.5 - Math.random());
      const selectedAnalogies = shuffledAnalogies.slice(0, Math.min(numAnalogies, shuffledAnalogies.length));

      selectedAnalogies.forEach((aItem, idx) => {
        const rawChoices = [{ text: aItem.target, correct: true }, ...aItem.distractors.slice(0, 4).map(d => ({ text: d, correct: false }))];
        const shuffledChoices = rawChoices.sort(() => 0.5 - Math.random());
        const correctLetter = letters[shuffledChoices.findIndex(c => c.correct)];

        result.push({
          id: result.length + 1,
          type: "analogy",
          section: "PART 2: ANALOGIES",
          stem: aItem.stem,
          choices: shuffledChoices.map((c, i) => ({ text: c.text, key: letters[i] })),
          answer: correctLetter,
          explanation: aItem.exp
        });
      });

      return result;
    }

    let QUESTIONS = [];
    let current = 0;
    let answers = [];
    let timeLeft = 1800;
    let timer = null;

    function startTest() {
      // Guaranteed 100% Unique, Non-Repeating 50-Question Exam Set
      QUESTIONS = generateUniqueSSATSet(50);

      answers = new Array(QUESTIONS.length).fill(null);
      current = 0;
      timeLeft = 1800;
      document.getElementById('topTimer').style.display = 'block';
      renderQ();
      showScreen('screenTest');

      timer = setInterval(() => {
        timeLeft--;
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        document.getElementById('topTimer').textContent = `⏳ ${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        if (timeLeft <= 0) finishTest();
      }, 1000);
    }

    function renderQ() {
      const q = QUESTIONS[current];
      document.getElementById('qNumberDisplay').textContent = `Question ${current + 1} of ${QUESTIONS.length}`;
      document.getElementById('qSectionDisplay').textContent = q.section;

      const stem = document.getElementById('stemDisplay');
      if (q.type === 'synonym') {
        stem.innerHTML = `<div style="font-size:0.85rem; color:#94a3b8; text-transform:uppercase; margin-bottom:6px;">Synonym of:</div><div class="stem-word">${q.prompt}</div>`;
      } else {
        stem.innerHTML = `<div style="font-size:0.85rem; color:#94a3b8; text-transform:uppercase; margin-bottom:6px;">Analogy:</div><div class="stem-analogy">${q.stem}...</div>`;
      }

      const opts = document.getElementById('optionsDisplay');
      opts.innerHTML = '';
      q.choices.forEach(c => {
        const div = document.createElement('div');
        div.className = `opt-btn ${answers[current] === c.key ? 'selected' : ''}`;
        div.onclick = () => {
          answers[current] = c.key;
          renderQ();
        };
        div.innerHTML = `<div class="opt-letter">${c.key}</div><div class="opt-text">${c.text}</div>`;
        opts.appendChild(div);
      });

      document.getElementById('btnPrev').disabled = current === 0;
      document.getElementById('btnNext').textContent = (current === QUESTIONS.length - 1) ? "Review" : "Next →";
    }

    function step(d) {
      if (d === 1 && current < QUESTIONS.length - 1) { current++; renderQ(); }
      else if (d === -1 && current > 0) { current--; renderQ(); }
    }

    function finishTest() {
      if (timer) clearInterval(timer);
      document.getElementById('topTimer').style.display = 'none';
      let correct = 0;
      for (let i = 0; i < QUESTIONS.length; i++) {
        if (answers[i] === QUESTIONS[i].answer) correct++;
      }
      document.getElementById('scoreSummary').textContent = `${correct} / ${QUESTIONS.length}`;
      document.getElementById('scorePercent').textContent = `${Math.round((correct/QUESTIONS.length)*100)}% Correct (Scale: 580/600)`;

      const b = document.getElementById('breakdownContainer');
      b.innerHTML = '';
      QUESTIONS.forEach((q, i) => {
        const isRight = answers[i] === q.answer;
        const div = document.createElement('div');
        div.className = 'card';
        div.style.padding = '18px';
        div.style.borderLeft = isRight ? '6px solid var(--success)' : '6px solid var(--danger)';
        div.innerHTML = `
          <div style="font-weight:800; color:#38bdf8;">Question ${i+1} (${q.type.toUpperCase()})</div>
          <div>Your Answer: ${answers[i] || 'None'} | Correct: <strong style="color:var(--success)">(${q.answer})</strong></div>
          <div style="margin-top:6px; font-size:0.9rem; color:#cbd5e1;">💡 ${q.explanation}</div>
        `;
        b.appendChild(div);
      });

      showScreen('screenScore');
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }
  </script>
