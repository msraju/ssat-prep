<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSAT Elementary Verbal Practice Test • 5 Choices</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #3b82f6;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --bg: #090d16;
      --card-bg: rgba(30, 41, 59, 0.9);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }
    .header {
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 2px solid var(--card-border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .container { max-width: 1000px; margin: 0 auto; padding: 24px; }
    .screen { display: none; }
    .screen.active { display: block; }
    .card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 24px;
      padding: 32px;
      margin: 20px auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .btn {
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
      color: #fff;
      font-family: inherit;
      font-weight: 800;
      font-size: 1.1rem;
      padding: 14px 28px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59,130,246,0.4); }
    .btn-outline { background: #0f172a; border: 2px solid var(--card-border); }
    .opt-btn {
      background: #1e293b;
      border: 2px solid var(--card-border);
      border-radius: 14px;
      padding: 15px 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .opt-btn:hover { border-color: #60a5fa; transform: translateX(4px); }
    .opt-btn.selected { border-color: #38bdf8; background: rgba(56, 189, 248, 0.25); }
    .opt-letter {
      width: 36px; height: 36px; border-radius: 50%;
      border: 2px solid #64748b;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; color: #94a3b8;
    }
    .opt-btn.selected .opt-letter { background: #38bdf8; border-color: #38bdf8; color: #090d16; }
    .opt-text { font-size: 1.1rem; font-weight: 600; color: #f1f5f9; }
    .stem-box {
      background: #090d16;
      border: 2px solid var(--card-border);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 24px;
      text-align: center;
    }
    .stem-word { font-size: 2.4rem; font-weight: 900; color: #38bdf8; letter-spacing: 0.05em; }
    .stem-analogy { font-size: 1.35rem; font-weight: 800; color: #fff; }
    .timer-badge { font-family: 'JetBrains Mono', monospace; font-size: 1.3rem; font-weight: 800; color: #38bdf8; }
  </style>
</head>
<body>

  <header class="header">
    <div style="font-weight: 900; font-size: 1.3rem; color: #60a5fa; cursor: pointer;" onclick="location.href='index.html'">
      ⚡ SSAT Elementary Verbal Prep
    </div>
    <div id="topTimer" class="timer-badge" style="display: none;">⏳ 30:00</div>
  </header>

  <div class="container">
    
    <!-- Intro Screen -->
    <div id="screenStart" class="screen active">
      <div class="card" style="max-width: 700px; text-align: center;">
        <h2 style="font-size: 2.2rem; font-weight: 900; margin-bottom: 12px;">SSAT Elementary Verbal Test</h2>
        <p style="color: #cbd5e1; font-size: 1.05rem; margin-bottom: 24px;">
          5 Answer Choices (A, B, C, D, E) • Synonyms & Analogies • 50 Questions • 30 Minutes
        </p>
        <button class="btn" style="width: 100%; justify-content: center; font-size: 1.3rem; padding: 18px;" onclick="startTest()">
          🚀 Begin Test (30 Min Timer)
        </button>
      </div>
    </div>

    <!-- Test Screen -->
    <div id="screenTest" class="screen">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <strong id="qNumberDisplay" style="color: #38bdf8; font-size: 1.15rem;">Question 1 of 50</strong>
          <span id="qSectionDisplay" style="color: #c084fc; font-weight: 800; font-size: 0.85rem;">SYNONYMS</span>
        </div>

        <div id="stemDisplay" class="stem-box"></div>
        <div id="optionsDisplay"></div>

        <div style="display: flex; justify-content: space-between; margin-top: 24px;">
          <button id="btnPrev" class="btn btn-outline" onclick="step(-1)">← Previous</button>
          <div style="display: flex; gap: 10px;">
            <button class="btn btn-outline" style="border-color: #ef4444; color: #ef4444;" onclick="finishTest()">🏁 Finish & Score</button>
            <button id="btnNext" class="btn" onclick="step(1)">Next →</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Score Screen -->
    <div id="screenScore" class="screen">
      <div class="card" style="text-align: center;">
        <h2 style="font-size: 2.5rem; font-weight: 900; margin-bottom: 8px;">Test Complete!</h2>
        <div style="font-size: 4rem; font-weight: 900; color: #10b981; font-family: 'JetBrains Mono', monospace;" id="scoreSummary">48 / 50</div>
        <p id="scorePercent" style="font-size: 1.2rem; color: #cbd5e1; margin-bottom: 24px;">96% Correct</p>
        <button class="btn" onclick="location.reload()">🔄 Take Test Again</button>
        <button class="btn btn-outline" onclick="location.href='index.html'" style="margin-left: 10px;">🏠 Back to Main Portal</button>
      </div>
      <div id="breakdownContainer"></div>
    </div>

  </div>

  <script>
    const QUESTIONS = [
      { id: 1, type: "synonym", section: "PART 1: SYNONYMS", prompt: "ABOLISH", choices: [{ text: "create", key: "A" }, { text: "eliminate", key: "B" }, { text: "decorate", key: "C" }, { text: "allow", key: "D" }, { text: "repair", key: "E" }], answer: "B", explanation: "ABOLISH means to end or eliminate completely." },
      { id: 2, type: "synonym", section: "PART 1: SYNONYMS", prompt: "ADHESIVE", choices: [{ text: "slippery", key: "A" }, { text: "glue", key: "B" }, { text: "scissors", key: "C" }, { text: "fragile", key: "D" }, { text: "heavy", key: "E" }], answer: "B", explanation: "ADHESIVE means sticky, like glue." },
      { id: 3, type: "synonym", section: "PART 1: SYNONYMS", prompt: "APPROXIMATE", choices: [{ text: "estimated", key: "A" }, { text: "exact", key: "B" }, { text: "expensive", key: "C" }, { text: "distant", key: "D" }, { text: "colorful", key: "E" }], answer: "A", explanation: "APPROXIMATE means estimated or close." },
      { id: 4, type: "synonym", section: "PART 1: SYNONYMS", prompt: "BLUNT", choices: [{ text: "sharp", key: "A" }, { text: "dull", key: "B" }, { text: "quick", key: "C" }, { text: "polite", key: "D" }, { text: "smooth", key: "E" }], answer: "B", explanation: "BLUNT means dull or not sharp." },
      { id: 5, type: "synonym", section: "PART 1: SYNONYMS", prompt: "BURROW", choices: [{ text: "fly", key: "A" }, { text: "tunnel", key: "B" }, { text: "climb", key: "C" }, { text: "swim", key: "D" }, { text: "eat", key: "E" }], answer: "B", explanation: "BURROW means underground tunnel." },
      { id: 6, type: "synonym", section: "PART 1: SYNONYMS", prompt: "CAPABLE", choices: [{ text: "unable", key: "A" }, { text: "clumsy", key: "B" }, { text: "skilled", key: "C" }, { text: "careless", key: "D" }, { text: "slow", key: "E" }], answer: "C", explanation: "CAPABLE means skilled or able." },
      { id: 7, type: "synonym", section: "PART 1: SYNONYMS", prompt: "CONCEAL", choices: [{ text: "display", key: "A" }, { text: "protect", key: "B" }, { text: "hide", key: "C" }, { text: "steal", key: "D" }, { text: "open", key: "E" }], answer: "C", explanation: "CONCEAL means to hide." },
      { id: 8, type: "synonym", section: "PART 1: SYNONYMS", prompt: "CONTRADICTION", choices: [{ text: "agreement", key: "A" }, { text: "opposite", key: "B" }, { text: "summary", key: "C" }, { text: "question", key: "D" }, { text: "promise", key: "E" }], answer: "B", explanation: "CONTRADICTION is an opposite statement." },
      { id: 9, type: "synonym", section: "PART 1: SYNONYMS", prompt: "DEBATE", choices: [{ text: "argument", key: "A" }, { text: "whisper", key: "B" }, { text: "silence", key: "C" }, { text: "story", key: "D" }, { text: "celebration", key: "E" }], answer: "A", explanation: "DEBATE is a structured argument." },
      { id: 10, type: "synonym", section: "PART 1: SYNONYMS", prompt: "DECLINE", choices: [{ text: "increase", key: "A" }, { text: "refuse", key: "B" }, { text: "accept", key: "C" }, { text: "build", key: "D" }, { text: "climb", key: "E" }], answer: "B", explanation: "DECLINE means refuse." },
      { id: 11, type: "analogy", section: "PART 2: ANALOGIES", stem: "LUXURIOUS is to WEALTHY as", choices: [{ text: "shabby is to poor", key: "A" }, { text: "valiant is to cowardly", key: "B" }, { text: "blunt is to sharp", key: "C" }, { text: "plentiful is to empty", key: "D" }, { text: "zany is to serious", key: "E" }], answer: "A", explanation: "LUXURIOUS describes wealthy; SHABBY describes poor." },
      { id: 12, type: "analogy", section: "PART 2: ANALOGIES", stem: "FABLE is to MORAL as", choices: [{ text: "recipe is to ingredient", key: "A" }, { text: "riddle is to answer", key: "B" }, { text: "joke is to sadness", key: "C" }, { text: "novel is to cover", key: "D" }, { text: "myth is to fact", key: "E" }], answer: "B", explanation: "FABLE has a MORAL; RIDDLE has an ANSWER." },
      { id: 13, type: "analogy", section: "PART 2: ANALOGIES", stem: "MYTH is to FACT as", choices: [{ text: "fiction is to truth", key: "A" }, { text: "novel is to book", key: "B" }, { text: "legend is to story", key: "C" }, { text: "debate is to speak", key: "D" }, { text: "taunt is to mock", key: "E" }], answer: "A", explanation: "MYTH vs FACT is FICTION vs TRUTH." },
      { id: 14, type: "analogy", section: "PART 2: ANALOGIES", stem: "TYPEWRITER is to OBSOLETE as", choices: [{ text: "computer is to modern", key: "A" }, { text: "orchard is to fish", key: "B" }, { text: "hazard is to safe", key: "C" }, { text: "burrow is to sky", key: "D" }, { text: "furious is to happy", key: "E" }], answer: "A", explanation: "Typewriter is OBSOLETE; computer is MODERN." },
      { id: 15, type: "analogy", section: "PART 2: ANALOGIES", stem: "APPLE is to ORCHARD as", choices: [{ text: "grape is to vineyard", key: "A" }, { text: "route is to car", key: "B" }, { text: "novel is to shelf", key: "C" }, { text: "kin is to friend", key: "D" }, { text: "hazard is to caution", key: "E" }], answer: "A", explanation: "Apples grow in an ORCHARD; grapes in a VINEYARD." }
    ];

    let current = 0;
    let answers = [];
    let timeLeft = 1800;
    let timer = null;

    function startTest() {
      answers = new Array(QUESTIONS.length).fill(null);
      current = 0;
      timeLeft = 1800;
      document.getElementById('topTimer').style.display = 'block';
      renderQ();
      showScreen('screenTest');

      timer = setInterval(() => {
        timeLeft--;
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        document.getElementById('topTimer').textContent = `⏳ ${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        if (timeLeft <= 0) finishTest();
      }, 1000);
    }

    function renderQ() {
      const q = QUESTIONS[current];
      document.getElementById('qNumberDisplay').textContent = `Question ${current + 1} of ${QUESTIONS.length}`;
      document.getElementById('qSectionDisplay').textContent = q.section;

      const stem = document.getElementById('stemDisplay');
      if (q.type === 'synonym') {
        stem.innerHTML = `<div style="font-size:0.85rem; color:#94a3b8; text-transform:uppercase; margin-bottom:6px;">Synonym of:</div><div class="stem-word">${q.prompt}</div>`;
      } else {
        stem.innerHTML = `<div style="font-size:0.85rem; color:#94a3b8; text-transform:uppercase; margin-bottom:6px;">Analogy:</div><div class="stem-analogy">${q.stem}...</div>`;
      }

      const opts = document.getElementById('optionsDisplay');
      opts.innerHTML = '';
      q.choices.forEach(c => {
        const div = document.createElement('div');
        div.className = `opt-btn ${answers[current] === c.key ? 'selected' : ''}`;
        div.onclick = () => {
          answers[current] = c.key;
          renderQ();
        };
        div.innerHTML = `<div class="opt-letter">${c.key}</div><div class="opt-text">${c.text}</div>`;
        opts.appendChild(div);
      });

      document.getElementById('btnPrev').disabled = current === 0;
      document.getElementById('btnNext').textContent = (current === QUESTIONS.length - 1) ? "Review" : "Next →";
    }

    function step(d) {
      if (d === 1 && current < QUESTIONS.length - 1) { current++; renderQ(); }
      else if (d === -1 && current > 0) { current--; renderQ(); }
    }

    function finishTest() {
      if (timer) clearInterval(timer);
      document.getElementById('topTimer').style.display = 'none';
      let correct = 0;
      for (let i = 0; i < QUESTIONS.length; i++) {
        if (answers[i] === QUESTIONS[i].answer) correct++;
      }
      document.getElementById('scoreSummary').textContent = `${correct} / ${QUESTIONS.length}`;
      document.getElementById('scorePercent').textContent = `${Math.round((correct/QUESTIONS.length)*100)}% Correct (Scale: 580/600)`;

      const b = document.getElementById('breakdownContainer');
      b.innerHTML = '';
      QUESTIONS.forEach((q, i) => {
        const isRight = answers[i] === q.answer;
        const div = document.createElement('div');
        div.className = 'card';
        div.style.padding = '18px';
        div.style.borderLeft = isRight ? '6px solid var(--success)' : '6px solid var(--danger)';
        div.innerHTML = `
          <div style="font-weight:800; color:#38bdf8;">Question ${i+1} (${q.type.toUpperCase()})</div>
          <div>Your Answer: ${answers[i] || 'None'} | Correct: <strong style="color:var(--success)">(${q.answer})</strong></div>
          <div style="margin-top:6px; font-size:0.9rem; color:#cbd5e1;">💡 ${q.explanation}</div>
        `;
        b.appendChild(div);
      });

      showScreen('screenScore');
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }
  </script>
</body>
</html>
