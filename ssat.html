<!DOCTYPE html>
<html lang="en">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {

      --accent: #f59e0b;

      --danger: #ef4444;
      --bg: #090d16;
      --card-bg: rgba(30, 41, 59, 0.9);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }
    .header {
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 2px solid var(--card-border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .container { max-width: 1000px; margin: 0 auto; padding: 24px; }
    .screen { display: none; }
    .screen.active { display: block; }
    .card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 24px;
      padding: 32px;
      margin: 20px auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .btn {
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
      color: #fff;
      font-family: inherit;
      font-weight: 800;
      font-size: 1.1rem;
      padding: 14px 28px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59,130,246,0.4); }
    .btn-outline { background: #0f172a; border: 2px solid var(--card-border); }
    .opt-btn {
      background: #1e293b;
      border: 2px solid var(--card-border);
      border-radius: 14px;
      padding: 15px 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.2s;

    .opt-btn.selected { border-color: #38bdf8; background: rgba(56, 189, 248, 0.25); }
    .opt-letter {
      width: 36px; height: 36px; border-radius: 50%;
      border: 2px solid #64748b;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; color: #94a3b8;
    }
    .opt-btn.selected .opt-letter { background: #38bdf8; border-color: #38bdf8; color: #090d16; }
    .opt-text { font-size: 1.1rem; font-weight: 600; color: #f1f5f9; }
    .stem-box {
      background: #090d16;
      border: 2px solid var(--card-border);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 24px;
      text-align: center;
    }

    .stem-analogy { font-size: 1.35rem; font-weight: 800; color: #fff; }

  </style>
</head>
<body>

  <header class="header">

      ["COURTEOUS", "polite", ["rude", "clumsy", "furious", "harsh", "selfish", "cruel", "mean", "impolite"], "polite, respectful, and mannerly"],
      ["CUNNING", "crafty", ["naive", "foolish", "clumsy", "honest", "simple", "innocent", "clueless", "dull"], "clever, sly, and crafty"],

      ["DECEIVE", "trick", ["support", "guide", "enlighten", "assist", "trust", "protect", "honor", "befriend"], "to mislead or trick intentionally"],
      ["DENSE", "thick", ["sparse", "airy", "empty", "thin", "clear", "open", "light", "hollow"], "closely packed or thick"],
      ["DILIGENT", "hardworking", ["lazy", "careless", "sluggish", "clumsy", "idle", "negligent", "tired", "distracted"], "steady, energetic, and hardworking"],
      ["DWINDLE", "diminish", ["expand", "multiply", "increase", "grow", "flourish", "thrive", "swell", "rise"], "to shrink, lessen, or diminish"],
      ["ELEGANT", "graceful", ["clumsy", "shabby", "awkward", "crude", "rough", "plain", "ugly", "cheap"], "graceful and refined in style"],
      ["EMERGE", "appear", ["disappear", "vanish", "hide", "sink", "conceal", "retreat", "recede", "perish"], "to come into view or appear"],
      ["ENDURE", "withstand", ["surrender", "collapse", "quit", "falter", "perish", "abandon", "yield", "weaken"], "to hold out against hardship or withstand"],
      ["FEEBLE", "frail", ["robust", "powerful", "mighty", "energetic", "sturdy", "tough", "healthy", "brave"], "weak, fragile, and frail"],
      ["FIERCE", "ferocious", ["tame", "gentle", "calm", "timid", "peaceful", "docile", "friendly", "quiet"], "savage, ferocious, and intense"],
      ["FORBID", "prohibit", ["allow", "encourage", "permit", "authorize", "welcome", "invite", "suggest", "praise"], "to order not to do something; prohibit"],
      ["GAUNT", "haggard", ["plump", "hefty", "stout", "cheerful", "robust", "healthy", "energetic", "bright"], "lean, bony, and haggard"],
      ["GLEAM", "shine", ["fade", "darken", "hide", "tarnish", "dim", "sink", "smudge", "shadow"], "to shine with a flash of light"],
      ["GRIEF", "sorrow", ["joy", "jubilation", "delight", "laughter", "cheer", "fortune", "victory", "triumph"], "deep distress and sorrow"],
      ["HARSH", "severe", ["gentle", "mild", "pleasant", "kind", "soft", "sweet", "lenient", "calm"], "rough, severe, or strict"],
      ["HAUGHTY", "arrogant", ["humble", "modest", "polite", "friendly", "timid", "meek", "respectful", "shy"], "blatantly proud and arrogant"],
      ["HURTLE", "rush", ["crawl", "linger", "saunter", "pause", "halt", "creep", "drift", "stroll"], "to rush with great speed"],
      ["IGNITE", "kindle", ["extinguish", "douse", "smother", "quench", "cool", "dampen", "freeze", "darken"], "to set on fire or kindle"],
      ["IMPARTIAL", "unbiased", ["prejudiced", "unfair", "biased", "partisan", "hostile", "corrupt", "favoring", "unequal"], "unbiased, just, and fair"],
      ["IMPULSIVE", "hasty", ["cautious", "careful", "deliberate", "thoughtful", "planned", "patient", "slow", "prudent"], "acting without thinking; hasty"]
    ];

    function generateSSATPool() {
      const letters = ['A', 'B', 'C', 'D', 'E'];
      const pool = [];

      SSAT_CORE_DICTIONARY.forEach((entry) => {
        const [word, correctSyn, distractors, meaning] = entry;
        for (let variant = 0; variant < 8; variant++) {
          const shuffledDist = [...distractors].sort(() => 0.5 - Math.random()).slice(0, 4);
          const rawChoices = [{ text: correctSyn, correct: true }, ...shuffledDist.map(d => ({ text: d, correct: false }))];
          const shuffledChoices = rawChoices.sort(() => 0.5 - Math.random());
          const correctLetter = letters[shuffledChoices.findIndex(c => c.correct)];

          pool.push({
            id: pool.length + 1,
            type: "synonym",
            section: "PART 1: SYNONYMS",
            prompt: word,
            choices: shuffledChoices.map((c, i) => ({ text: c.text, key: letters[i] })),
            answer: correctLetter,
            explanation: `${word} means ${meaning}. Therefore, ${correctSyn.toUpperCase()} is the correct synonym.`
          });
        }
      });

      for (let aIdx = 0; aIdx < 600; aIdx++) {
        const e1 = SSAT_CORE_DICTIONARY[Math.floor(Math.random() * SSAT_CORE_DICTIONARY.length)];
        const e2 = SSAT_CORE_DICTIONARY[Math.floor(Math.random() * SSAT_CORE_DICTIONARY.length)];
        const e3 = SSAT_CORE_DICTIONARY[Math.floor(Math.random() * SSAT_CORE_DICTIONARY.length)];
        const e4 = SSAT_CORE_DICTIONARY[Math.floor(Math.random() * SSAT_CORE_DICTIONARY.length)];
        const e5 = SSAT_CORE_DICTIONARY[Math.floor(Math.random() * SSAT_CORE_DICTIONARY.length)];

        const stem = `${e1[0]} is to ${e1[1].toUpperCase()} as`;
        const target = `${e2[0]} is to ${e2[1]}`;
        const d1 = `${e3[0]} is to ${e3[2][0]}`;
        const d2 = `${e4[0]} is to ${e4[2][1]}`;
        const d3 = `${e5[0]} is to ${e5[2][2]}`;
        const d4 = `${e1[0]} is to ${e1[2][0]}`;

        const rawChoices = [
          { text: target, correct: true },
          { text: d1, correct: false },
          { text: d2, correct: false },
          { text: d3, correct: false },
          { text: d4, correct: false }
        ];
        const shuffledChoices = rawChoices.sort(() => 0.5 - Math.random());
        const correctLetter = letters[shuffledChoices.findIndex(c => c.correct)];

        pool.push({
          id: pool.length + 1,
          type: "analogy",
          section: "PART 2: ANALOGIES",
          stem: stem,
          choices: shuffledChoices.map((c, i) => ({ text: c.text, key: letters[i] })),
          answer: correctLetter,
          explanation: `Bridge: ${e1[0]} means ${e1[1]}. Similarly, ${e2[0]} means ${e2[1]}.`
        });
      }

      return pool;
    }

    let QUESTIONS = [];
    let current = 0;
    let answers = [];
    let timeLeft = 1800;
    let timer = null;

    function startTest() {
      const fullPool = generateSSATPool();
      QUESTIONS = [...fullPool].sort(() => 0.5 - Math.random()).slice(0, 50);

      answers = new Array(QUESTIONS.length).fill(null);
      current = 0;
      timeLeft = 1800;
      document.getElementById('topTimer').style.display = 'block';
      renderQ();
      showScreen('screenTest');

      timer = setInterval(() => {
        timeLeft--;
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        document.getElementById('topTimer').textContent = `⏳ ${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        if (timeLeft <= 0) finishTest();
      }, 1000);
    }

    function renderQ() {
      const q = QUESTIONS[current];
      document.getElementById('qNumberDisplay').textContent = `Question ${current + 1} of ${QUESTIONS.length}`;
      document.getElementById('qSectionDisplay').textContent = q.section;

      const stem = document.getElementById('stemDisplay');
      if (q.type === 'synonym') {
        stem.innerHTML = `<div style="font-size:0.85rem; color:#94a3b8; text-transform:uppercase; margin-bottom:6px;">Synonym of:</div><div class="stem-word">${q.prompt}</div>`;
      } else {
        stem.innerHTML = `<div style="font-size:0.85rem; color:#94a3b8; text-transform:uppercase; margin-bottom:6px;">Analogy:</div><div class="stem-analogy">${q.stem}...</div>`;
      }

      const opts = document.getElementById('optionsDisplay');
      opts.innerHTML = '';
      q.choices.forEach(c => {
        const div = document.createElement('div');
        div.className = `opt-btn ${answers[current] === c.key ? 'selected' : ''}`;
        div.onclick = () => {
          answers[current] = c.key;
          renderQ();
        };
        div.innerHTML = `<div class="opt-letter">${c.key}</div><div class="opt-text">${c.text}</div>`;
        opts.appendChild(div);
      });

      document.getElementById('btnPrev').disabled = current === 0;
      document.getElementById('btnNext').textContent = (current === QUESTIONS.length - 1) ? "Review" : "Next →";
    }

    function step(d) {
      if (d === 1 && current < QUESTIONS.length - 1) { current++; renderQ(); }
      else if (d === -1 && current > 0) { current--; renderQ(); }
    }

    function finishTest() {
      if (timer) clearInterval(timer);
      document.getElementById('topTimer').style.display = 'none';
      let correct = 0;
      for (let i = 0; i < QUESTIONS.length; i++) {
        if (answers[i] === QUESTIONS[i].answer) correct++;
      }
      document.getElementById('scoreSummary').textContent = `${correct} / ${QUESTIONS.length}`;
      document.getElementById('scorePercent').textContent = `${Math.round((correct/QUESTIONS.length)*100)}% Correct (Scale: 580/600)`;

      const b = document.getElementById('breakdownContainer');
      b.innerHTML = '';
      QUESTIONS.forEach((q, i) => {
        const isRight = answers[i] === q.answer;
        const div = document.createElement('div');
        div.className = 'card';
        div.style.padding = '18px';
        div.style.borderLeft = isRight ? '6px solid var(--success)' : '6px solid var(--danger)';
        div.innerHTML = `
          <div style="font-weight:800; color:#38bdf8;">Question ${i+1} (${q.type.toUpperCase()})</div>
          <div>Your Answer: ${answers[i] || 'None'} | Correct: <strong style="color:var(--success)">(${q.answer})</strong></div>
          <div style="margin-top:6px; font-size:0.9rem; color:#cbd5e1;">💡 ${q.explanation}</div>
        `;
        b.appendChild(div);
      });

      showScreen('screenScore');
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }
  </script>
</body>
</html>
